name: ElliGAT Full Pipeline

# Runs the whole pipeline on GitHub-hosted (CPU-only) runners:
#   setup     -> download/cache the Elliptic dataset, build the seed matrix
#   pipeline  -> one job PER SEED (each gets its own 6-hour limit), in parallel
#   aggregate -> merge per-seed metrics into one mean ± std table
#   ablations -> optional FAGA / PLP ablation scripts
#
# Start with mode=smoke (1 seed, a few epochs, ~minutes) to prove every stage
# works end-to-end, then run mode=full.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "smoke = 1 seed, tiny epochs (checks the whole pipeline runs). full = real run."
        type: choice
        options: [smoke, full]
        default: smoke
      entrypoint:
        description: "Pipeline script to run"
        type: choice
        options: [main.py, run_clean_reproduction.py]
        default: main.py
      seeds:
        description: "Comma-separated seeds for full mode (one parallel job per seed)"
        type: string
        default: "42,123,2024,17,99"
      loss_name:
        description: "asymmetric = current default; focal + mlp edge encoder reproduces the README table"
        type: choice
        options: [asymmetric, focal]
        default: asymmetric
      edge_encoding:
        description: "Temporal edge encoder"
        type: choice
        options: [sinusoidal, mlp]
        default: sinusoidal
      epochs:
        description: "Max fine-tuning epochs in full mode (config default is 300)"
        type: string
        default: "300"
      hidden_dim:
        description: "GNN hidden size (config default 256). Lower it (e.g. 128) if runs die from memory."
        type: string
        default: "256"
      explain_nodes:
        description: "GNNExplainer nodes in full mode (code default 30; explainer is slow on CPU)"
        type: string
        default: "10"
      explain_epochs:
        description: "GNNExplainer epochs per node in full mode (code default 150)"
        type: string
        default: "50"
      run_ablations:
        description: "Also run run_faga_ablation.py and run_plp_ablation.py (single seed, slow)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: elligat-pipeline-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.11"
  TORCH_VERSION: "2.6.0"
  DATA_CACHE_KEY: elliptic-dataset-v1

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  setup:
    name: Dataset + seed matrix
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      seeds: ${{ steps.matrix.outputs.seeds }}
    steps:
      - name: Build seed matrix
        id: matrix
        env:
          MODE: ${{ inputs.mode }}
          SEEDS_INPUT: ${{ inputs.seeds }}
        run: |
          set -euo pipefail
          if [ "$MODE" = "smoke" ]; then
            SEEDS="42"
          else
            SEEDS="$(echo "$SEEDS_INPUT" | tr -d ' ')"
          fi
          if ! echo "$SEEDS" | grep -Eq '^[0-9]+(,[0-9]+)*$'; then
            echo "::error::seeds must be comma-separated integers, got: $SEEDS"
            exit 1
          fi
          JSON="$(python3 -c 'import json,sys; print(json.dumps(sys.argv[1].split(",")))' "$SEEDS")"
          echo "seeds=$JSON" >> "$GITHUB_OUTPUT"
          echo "Seed matrix: $JSON"

      - name: Restore dataset cache
        id: cache
        uses: actions/cache@v4
        with:
          path: data/elliptic
          key: ${{ env.DATA_CACHE_KEY }}

      - name: Set up Python
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download Elliptic dataset from Kaggle
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade kaggle
          mkdir -p data/elliptic
          kaggle datasets download -d ellipticco/elliptic-data-set -p data/elliptic
          unzip -o data/elliptic/elliptic-data-set.zip -d data/elliptic
          rm -f data/elliptic/elliptic-data-set.zip

      - name: Verify dataset files
        run: |
          set -euo pipefail
          for f in elliptic_txs_classes.csv elliptic_txs_features.csv elliptic_txs_edgelist.csv; do
            find data/elliptic -name "$f" -print -quit | grep -q . \
              || { echo "::error::$f not found in data/elliptic"; exit 1; }
          done
          echo "All three expected CSV files are present."

  # ───────────────────────────────────────────────────────────────────────────
  pipeline:
    name: Pipeline (seed ${{ matrix.seed }})
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 350          # GitHub-hosted jobs are hard-capped at 360
    strategy:
      fail-fast: false
      matrix:
        seed: ${{ fromJSON(needs.setup.outputs.seeds) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies (CPU torch, pinned)
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          echo "torch==${TORCH_VERSION}" > constraints.txt
          python -m pip install "torch==${TORCH_VERSION}" \
            --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -c constraints.txt -r requirements.txt
          python -c "import torch, torch_geometric; print('torch', torch.__version__, '| PyG', torch_geometric.__version__)"

      - name: Restore dataset cache
        uses: actions/cache/restore@v4
        with:
          path: data/elliptic
          key: ${{ env.DATA_CACHE_KEY }}
          fail-on-cache-miss: true

      - name: Locate dataset folder
        id: data
        run: |
          set -euo pipefail
          FEATS="$(find data/elliptic -name elliptic_txs_features.csv -print -quit)"
          DIR="$(cd "$(dirname "$FEATS")" && pwd)"
          echo "path=$DIR" >> "$GITHUB_OUTPUT"
          echo "Dataset folder: $DIR"

      - name: Check config honours env overrides
        env:
          SEEDS: ${{ matrix.seed }}
          EPOCHS: "7"
          EXPLAIN_NODES: "3"
          PLP_EPOCHS: "4"
        run: |
          python -c "
          import os
          from configs.config import SEEDS, EPOCHS, EXPLAIN_NODES, PLP_EPOCHS
          want = [int(os.environ['SEEDS'])]
          assert SEEDS == want, f'configs/config.py ignores the SEEDS env var (got {SEEDS}, want {want}). Commit the updated configs/config.py.'
          assert EPOCHS == 7, 'configs/config.py ignores the EPOCHS env var. Commit the updated configs/config.py.'
          assert EXPLAIN_NODES == 3 and PLP_EPOCHS == 4, 'configs/config.py ignores EXPLAIN_NODES/PLP_EPOCHS. Commit the updated configs/config.py.'
          print('config env overrides OK')
          "

      - name: Add swap and start memory monitor
        env:
          OUTPUT_DIR: outputs/seed-${{ matrix.seed }}
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_DIR"
          free -h
          sudo swapoff -a || true
          sudo fallocate -l 8G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h
          nohup bash -c 'while true; do date +%T; free -m | sed -n 2,3p; sleep 30; done' \
            > "$OUTPUT_DIR/mem.log" 2>&1 &

      - name: Record provenance (commit, versions, settings)
        env:
          OUTPUT_DIR: outputs/seed-${{ matrix.seed }}
          RUN_MODE: ${{ inputs.mode }}
          ENTRYPOINT: ${{ inputs.entrypoint }}
          LOSS_NAME: ${{ inputs.loss_name }}
          EDGE_ENCODING: ${{ inputs.edge_encoding }}
          EPOCHS_INPUT: ${{ inputs.epochs }}
          HIDDEN_DIM_INPUT: ${{ inputs.hidden_dim }}
          SEED: ${{ matrix.seed }}
        run: |
          set -euo pipefail
          python -m pip freeze > "$OUTPUT_DIR/pip_freeze.txt"
          python - <<'PY'
          import json, os, platform
          keys = ["RUN_MODE","ENTRYPOINT","LOSS_NAME","EDGE_ENCODING","EPOCHS_INPUT","HIDDEN_DIM_INPUT","SEED"]
          info = {k: os.environ[k] for k in keys}
          info.update(commit=os.environ["GITHUB_SHA"], ref=os.environ["GITHUB_REF"],
                      run_id=os.environ["GITHUB_RUN_ID"], python=platform.python_version(),
                      runner=os.environ.get("RUNNER_OS", ""))
          json.dump(info, open(os.path.join(os.environ["OUTPUT_DIR"], "provenance.json"), "w"), indent=2)
          PY

      - name: Run pipeline
        env:
          ENTRYPOINT: ${{ inputs.entrypoint }}
          BITCOIN_DATA_PATH: ${{ steps.data.outputs.path }}
          ELLIPTIC_CACHE_PATH: ${{ steps.data.outputs.path }}
          OUTPUT_DIR: outputs/seed-${{ matrix.seed }}
          SEEDS: ${{ matrix.seed }}
          LOSS_NAME: ${{ inputs.loss_name }}
          EDGE_ENCODING: ${{ inputs.edge_encoding }}
          EPOCHS: ${{ inputs.mode == 'smoke' && '3' || inputs.epochs }}
          HIDDEN_DIM: ${{ inputs.mode == 'smoke' && '64' || inputs.hidden_dim }}
          PRETRAIN_EPOCHS: ${{ inputs.mode == 'smoke' && '2' || '50' }}
          PLP_EPOCHS: ${{ inputs.mode == 'smoke' && '3' || '50' }}
          MC_SAMPLES: ${{ inputs.mode == 'smoke' && '5' || '30' }}
          EXPLAIN_NODES: ${{ inputs.mode == 'smoke' && '2' || inputs.explain_nodes }}
          EXPLAIN_EPOCHS: ${{ inputs.mode == 'smoke' && '5' || inputs.explain_epochs }}
          CONTRASTIVE_MAX_NODES: "2048"
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_DIR"
          python -u "$ENTRYPOINT" 2>&1 | tee "$OUTPUT_DIR/stdout.log"

      - name: Diagnose failure (memory / OOM)
        if: failure()
        env:
          OUTPUT_DIR: outputs/seed-${{ matrix.seed }}
        run: |
          {
            echo "### Failure diagnostics (seed ${{ matrix.seed }})"
            echo '```text'
            echo "--- last memory samples ---"
            tail -n 12 "$OUTPUT_DIR/mem.log" 2>/dev/null || true
            echo "--- kernel OOM messages ---"
            sudo dmesg 2>/dev/null | grep -iE "out of memory|killed process|oom" | tail -n 5 || echo "(none found)"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Job summary
        if: always()
        env:
          OUTPUT_DIR: outputs/seed-${{ matrix.seed }}
        run: |
          {
            echo "## Seed ${{ matrix.seed }} — ${{ inputs.entrypoint }} (${{ inputs.mode }})"
            echo
            echo "Loss: \`${{ inputs.loss_name }}\` · Edge encoder: \`${{ inputs.edge_encoding }}\`"
            echo
            ls -lh "$OUTPUT_DIR" 2>/dev/null | sed 's/^/    /' || true
            echo
            echo '```text'
            tail -n 40 "$OUTPUT_DIR/stdout.log" 2>/dev/null || echo "(no log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-seed-${{ matrix.seed }}
          path: outputs/seed-${{ matrix.seed }}/
          if-no-files-found: warn
          retention-days: 30

  # ───────────────────────────────────────────────────────────────────────────
  aggregate:
    name: Aggregate seeds
    needs: pipeline
    if: ${{ !cancelled() && needs.pipeline.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install scipy (Wilcoxon tests)
        run: python -m pip install scipy

      - name: Download per-seed results
        uses: actions/download-artifact@v4
        with:
          pattern: results-seed-*
          path: all-results

      - name: Merge into mean ± std table
        run: |
          set -euo pipefail
          python scripts/aggregate_results.py all-results aggregate | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload aggregate
        uses: actions/upload-artifact@v4
        with:
          name: results-aggregate
          path: aggregate/
          retention-days: 90

  # ───────────────────────────────────────────────────────────────────────────
  ablations:
    name: Ablation (${{ matrix.script }})
    needs: setup
    if: ${{ inputs.run_ablations }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        script: [run_faga_ablation.py, run_plp_ablation.py]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies (CPU torch, pinned)
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          echo "torch==${TORCH_VERSION}" > constraints.txt
          python -m pip install "torch==${TORCH_VERSION}" \
            --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -c constraints.txt -r requirements.txt

      - name: Restore dataset cache
        uses: actions/cache/restore@v4
        with:
          path: data/elliptic
          key: ${{ env.DATA_CACHE_KEY }}
          fail-on-cache-miss: true

      - name: Locate dataset folder
        id: data
        run: |
          set -euo pipefail
          FEATS="$(find data/elliptic -name elliptic_txs_features.csv -print -quit)"
          echo "path=$(cd "$(dirname "$FEATS")" && pwd)" >> "$GITHUB_OUTPUT"

      - name: Run ablation
        env:
          SCRIPT: ${{ matrix.script }}
          BITCOIN_DATA_PATH: ${{ steps.data.outputs.path }}
          ELLIPTIC_CACHE_PATH: ${{ steps.data.outputs.path }}
          OUTPUT_DIR: outputs/ablation
          SEEDS: "42"
          LOSS_NAME: ${{ inputs.loss_name }}
          EDGE_ENCODING: ${{ inputs.edge_encoding }}
          EPOCHS: ${{ inputs.mode == 'smoke' && '3' || inputs.epochs }}
          PRETRAIN_EPOCHS: ${{ inputs.mode == 'smoke' && '2' || '50' }}
          MC_SAMPLES: ${{ inputs.mode == 'smoke' && '5' || '30' }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_DIR"
          python -u "$SCRIPT" 2>&1 | tee "$OUTPUT_DIR/${SCRIPT%.py}.stdout.log"

      - name: Upload ablation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ablation-${{ matrix.script }}
          path: outputs/ablation/
          if-no-files-found: warn
          retention-days: 30
