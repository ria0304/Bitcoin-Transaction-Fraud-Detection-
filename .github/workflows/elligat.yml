name: ElliGAT Pipeline Preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect cloud resources
        run: |
          echo "=== CPU ==="
          nproc
          lscpu
          echo "=== MEMORY ==="
          free -h
          echo "=== DISK ==="
          df -h .
          echo "=== REPOSITORY ==="
          pwd
          git status --short

      - name: Inspect project files
        run: |
          echo "=== Top-level files ==="
          ls -lah
          echo "=== Python and dependency files ==="
          find . -maxdepth 3 -type f \
            \( -name "requirements*.txt" \
            -o -name "pyproject.toml" \
            -o -name "environment.yml" \
            -o -name "README*" \
            -o -name ".env.example" \) \
            -not -path "./.git/*" | sort
          echo "=== Dataset candidates ==="
          find . -maxdepth 4 -type f \
            \( -iname "*elliptic*.csv" \
            -o -iname "*elliptic*.zip" \) \
            -not -path "./.git/*" | head -100

      - name: Check Python
        run: |
          python3 --version
          python3 -m pip --version

      - name: Save preflight report
        if: always()
        run: |
          {
            echo "## ElliGAT Preflight"
            echo
            echo "Commit: $GITHUB_SHA"
            echo
            echo '```text'
            nproc
            free -h
            df -h .
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
