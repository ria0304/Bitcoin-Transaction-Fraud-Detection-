name: Run ElliGAT Core Pipeline

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Kaggle CLI
        run: |
          python -m pip install --upgrade pip
          python -m pip install kaggle

      - name: Install PyTorch (CPU build, pinned)
        run: |
          python -m pip install torch==2.6.0 \
            --index-url https://download.pytorch.org/whl/cpu

      - name: Install project dependencies (torch pinned, PyG extensions stripped)
        run: |
          echo "torch==2.6.0" > constraints.txt
          grep -viE '^[[:space:]]*(torch[-_]scatter|torch[-_]sparse|torch[-_]cluster|pyg[-_]lib|torchvision)' requirements.txt > requirements.ci.txt
          python -m pip install -r requirements.ci.txt -c constraints.txt

      - name: Verify installs
        run: |
          python -c "import torch, torch_geometric, xgboost, lightgbm, sklearn; from torch_geometric.nn import GATv2Conv; print('torch', torch.__version__); print('torch_geometric', torch_geometric.__version__)"

      - name: Download Elliptic dataset
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p data/elliptic
          kaggle datasets download \
            -d ellipticco/elliptic-data-set \
            -p data/elliptic
          mkdir -p data/elliptic/unpacked
          unzip -o data/elliptic/elliptic-data-set.zip \
            -d data/elliptic/unpacked

      - name: Locate and verify dataset
        run: |
          set -euo pipefail

          DATA_DIR="$(find "$GITHUB_WORKSPACE/data/elliptic/unpacked" \
            -type f -name elliptic_txs_features.csv \
            -print -quit | xargs -r dirname)"

          test -n "$DATA_DIR"
          test -f "$DATA_DIR/elliptic_txs_classes.csv"
          test -f "$DATA_DIR/elliptic_txs_edgelist.csv"

          echo "BITCOIN_DATA_PATH=$DATA_DIR" >> "$GITHUB_ENV"
          echo "ELLIPTIC_CACHE_PATH=$DATA_DIR" >> "$GITHUB_ENV"
          echo "Dataset directory: $DATA_DIR"

      - name: Run core pipeline
        run: |
          set -o pipefail
          mkdir -p outputs
          python -u main.py 2>&1 | tee outputs/github_actions_run.log

      - name: Save experiment outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: elligat-core-results
          path: |
            outputs/
            *.png
            *.txt
          if-no-files-found: warn
          retention-days: 7
